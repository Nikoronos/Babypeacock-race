<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuş Oyunu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121212; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const playerImg = new Image();
        playerImg.src = 'drXH10s8.jpg';

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 64, 
            speed: 4,
            angle: 0
        };

        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // Bilgisayar Kontrolleri (WASD + Fare)
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Mobil Dokunmatik Kontroller
        window.addEventListener('touchstart', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        function update() {
            // Yön tuşları ile hareket
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;

            // Kuşun fareye veya dokunulan yere dönmesi
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin Çizgileri
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            const gridSize = 60;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Kuş Çizimi
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle + Math.PI / 2);

            if (playerImg.complete) {
                ctx.drawImage(playerImg, -player.size / 2, -player.size / 2, player.size, player.size);
            } else {
                ctx.fillStyle = '#2ea44f';
                ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
