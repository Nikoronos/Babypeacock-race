<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babypeacock Race - GTA Neon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Monoton&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            overflow: hidden;
            touch-action: none; 
        }

        /* Arka Plan Izgarası (Mavi-Yeşil Uyumu) */
        .neon-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            bottom: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 255, 150, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 200, 255, 0.4) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(70deg);
            animation: moveGrid 3s linear infinite;
            z-index: 1;
        }

        @keyframes moveGrid {
            0% { transform: perspective(600px) rotateX(70deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(70deg) translateY(60px); }
        }

        /* Mobil Uyumlu Mavi-Yeşil Yazı */
        .neon-title {
            position: absolute;
            top: 12%;
            width: 100%;
            text-align: center;
            font-family: 'Monoton', cursive;
            /* Mobilde küçülen, PC'de büyüyen dinamik font */
            font-size: clamp(35px, 12vw, 65px); 
            line-height: 1.2;
            color: #00ffcc; /* Mavi-Yeşil (Cyan) */
            text-shadow: 
                0 0 5px #00ffcc,
                0 0 10px #00ffcc,
                0 0 20px #0088ff,
                0 0 40px #0088ff,
                0 0 80px #00ff00; /* Dışa doğru yeşil parlama */
            z-index: 10;
        }

        /* Kuş Karakteri */
        #player {
            position: absolute;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 65%;
            transform: translate(-50%, -50%);
            background-image: url('drXH10s8.jpg'); 
            background-size: cover;
            background-position: center;
            mix-blend-mode: screen; 
            /* Kuşun etrafındaki parlama da mavi-yeşil yapıldı */
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8)); 
            z-index: 20;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- Yazıyı alt alta bölmek için <br> eklendi -->
    <div class="neon-title">BABYPEACOCK<br>RACE</div>
    
    <div class="neon-grid"></div>
    
    <div id="player"></div>
    
    <div id="joystick-zone"></div>

    <script>
        const player = document.getElementById('player');
        const zone = document.getElementById('joystick-zone');
        
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight * 0.65;
        let targetX = posX;
        let targetY = posY;
        let isMoving = false;
        
        const speed = 6; 

        function setTarget(e) {
            isMoving = true;
            if(e.touches) {
                targetX = e.touches[0].clientX;
                targetY = e.touches[0].clientY;
            } else {
                targetX = e.clientX;
                targetY = e.clientY;
            }
        }

        zone.addEventListener('mousedown', setTarget);
        zone.addEventListener('mousemove', (e) => { if(isMoving) setTarget(e); });
        zone.addEventListener('mouseup', () => isMoving = false);

        zone.addEventListener('touchstart', setTarget);
        zone.addEventListener('touchmove', setTarget);
        zone.addEventListener('touchend', () => isMoving = false);

        function gameLoop() {
            if (isMoving) {
                const dx = targetX - posX;
                const dy = targetY - posY;
                const dist = Math.hypot(dx, dy);
                
                if (dist > speed) {
                    posX += (dx / dist) * speed;
                    posY += (dy / dist) * speed;
                }
            }
            
            player.style.left = posX + 'px';
            player.style.top = posY + 'px';

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
