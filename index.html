<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BABYPEACOCK</title>


<style>

/* =========================
   TEMEL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


body{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =========================
   ARKA PLAN
========================= */

#scene{

    position:absolute;

    inset:0;

    overflow:hidden;

    background:

    radial-gradient(
        circle at 50% 47%,
        rgba(0,255,120,.07),
        transparent 35%
    ),

    radial-gradient(
        circle at 50% 50%,
        rgba(0,150,255,.05),
        #000 70%
    );

}


/* =========================
   HAREKETLİ PARÇACIK
========================= */

.particle{

    position:absolute;

    border-radius:50%;

    animation:
    particleMove linear infinite;

}


.particle.blue{

    background:#00bfff;

    box-shadow:
    0 0 6px #00bfff;

}


.particle.green{

    background:#00ff66;

    box-shadow:
    0 0 6px #00ff66;

}


@keyframes particleMove{

    0%{

        transform:
        translateY(50px);

        opacity:0;

    }

    25%{

        opacity:.8;

    }

    100%{

        transform:
        translateY(-150px);

        opacity:0;

    }

}


/* =========================
   HIZ ÇİZGİLERİ
========================= */

.speedLine{

    position:absolute;

    height:2px;

    border-radius:20px;

    animation:
    speedMove linear infinite;

}


.speedLine.blue{

    background:#008cff;

    box-shadow:

    0 0 5px #008cff,

    0 0 12px
    rgba(0,140,255,.6);

}


.speedLine.green{

    background:#00dd55;

    box-shadow:

    0 0 5px #00dd55,

    0 0 12px
    rgba(0,220,85,.6);

}


@keyframes speedMove{

    from{

        transform:
        translateX(-130vw);

    }

    to{

        transform:
        translateX(230vw);

    }

}


/* =========================
   ANA İÇERİK
========================= */

.content{

    position:relative;

    z-index:10;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:0 12px;

}


/* =========================
   KUŞ
========================= */

.peacock{

    display:block;

    width:min(58vw,330px);

    height:auto;

    object-fit:contain;

    /*
       ÖNEMLİ:

       JPG içerisindeki siyah alanı
       arka planla birleştirir.

       Böylece siyah kare yerine
       esas olarak kuş görünür.
    */

    mix-blend-mode:screen;

    /*
       Kuşun renklerini
       biraz güçlendiriyoruz
    */

    filter:

    brightness(1.20)

    contrast(1.15)

    saturate(1.20)

    drop-shadow(
        0 0 5px
        rgba(0,170,255,.30)
    )

    drop-shadow(
        0 0 9px
        rgba(0,255,100,.20)
    );


    margin-bottom:16px;

    animation:
    birdBreath 4s
    ease-in-out infinite;

}


@keyframes birdBreath{

    0%,
    100%{

        transform:
        scale(1);

    }

    50%{

        transform:
        scale(1.025);

    }

}


/* =========================
   BABYPEACOCK
========================= */

.logo{

    width:100%;

    text-align:center;

    white-space:nowrap;

    font-size:
    clamp(
        25px,
        7.4vw,
        72px
    );

    font-weight:900;

    letter-spacing:.025em;

    line-height:1.05;


    background:

    linear-gradient(

        90deg,

        #009cff 0%,

        #00d9ff 35%,

        #00ff99 68%,

        #41ff45 100%

    );


    -webkit-background-clip:text;

    background-clip:text;

    -webkit-text-fill-color:
    transparent;


    /*
       Hafif neon.
       Yazı bulanıklaşmasın.
    */

    text-shadow:

    0 0 2px
    rgba(0,190,255,.9),

    0 0 6px
    rgba(0,255,120,.45);


    position:relative;

}


/* =========================
   LOGO IŞIK TARAMASI
========================= */

.logo::after{

    content:"";

    position:absolute;

    top:-20%;

    left:-40%;

    width:18%;

    height:140%;


    background:

    linear-gradient(

        90deg,

        transparent,

        rgba(255,255,255,.75),

        transparent

    );


    transform:
    skewX(-20deg);

    filter:
    blur(3px);

    animation:
    scanLogo 5s
    ease-in-out infinite;

}


@keyframes scanLogo{

    0%,
    20%{

        left:-40%;

        opacity:0;

    }

    30%{

        opacity:.8;

    }

    60%{

        left:120%;

        opacity:0;

    }

    100%{

        left:120%;

        opacity:0;

    }

}


/* =========================
   SLOGAN
========================= */

.sloganBox{

    height:28px;

    margin-top:15px;

    display:flex;

    justify-content:center;

    align-items:center;

}


#slogan{

    color:#84dfff;

    font-family:

    "Courier New",
    monospace;

    font-size:
    clamp(
        10px,
        2.5vw,
        15px
    );

    letter-spacing:.22em;

    white-space:nowrap;

    text-shadow:

    0 0 5px
    rgba(0,180,255,.65);

}


/* =========================
   DAKTİLO İMLECİ
========================= */

.cursor{

    width:2px;

    height:15px;

    margin-left:4px;

    background:#00ff88;

    box-shadow:
    0 0 5px #00ff88;

    animation:
    cursorBlink .7s
    infinite;

}


@keyframes cursorBlink{

    0%,
    45%{

        opacity:1;

    }

    46%,
    100%{

        opacity:0;

    }

}


/* =========================
   ALT GRID
========================= */

.grid{

    position:absolute;

    left:-30%;

    bottom:-6%;

    width:160%;

    height:25%;

    opacity:.12;


    transform:

    perspective(350px)

    rotateX(62deg);


    transform-origin:
    center bottom;


    background-image:

    linear-gradient(

        rgba(0,255,100,.6)
        1px,

        transparent 1px

    ),

    linear-gradient(

        90deg,

        rgba(0,150,255,.6)
        1px,

        transparent 1px

    );


    background-size:

    100% 32px,

    48px 100%;


    animation:

    gridMove
    2.5s
    linear
    infinite;

}


@keyframes gridMove{

    from{

        background-position:
        0 0,
        0 0;

    }

    to{

        background-position:
        0 32px,
        0 0;

    }

}


/* =========================
   MOBİL
========================= */

@media(max-width:420px){

    .peacock{

        width:55vw;

        max-width:280px;

    }


    .logo{

        font-size:7.2vw;

        letter-spacing:.015em;

    }


    #slogan{

        font-size:2.35vw;

        letter-spacing:.18em;

    }

}


</style>

</head>


<body>


<div id="scene">

    <div class="grid"></div>

</div>


<!-- =====================
     ANA İÇERİK
===================== -->

<div class="content">


    <!-- KUŞ -->

    <img
    src="drXH10s8.jpg"
    class="peacock"
    alt="Babypeacock">


    <!-- BABYPEACOCK -->

    <div class="logo">

        BABYPEACOCK

    </div>


    <!-- DAKTİLO SLOGAN -->

    <div class="sloganBox">

        <span id="slogan"></span>

        <span class="cursor"></span>

    </div>


</div>



<script>


/* =========================
   ARKA PLAN
========================= */

const scene =
document.getElementById("scene");


/* =========================
   HIZ ÇİZGİLERİ
========================= */

for(
    let i=0;
    i<35;
    i++
){

    const line =
    document.createElement("div");


    line.className =

    "speedLine " +

    (
        i % 2 === 0
        ? "blue"
        : "green"
    );


    line.style.top =

    Math.random()
    *100
    +"%";


    line.style.left =

    (
        -400
        -
        Math.random()*500
    )

    +"px";


    line.style.width =

    (
        60
        +
        Math.random()*250
    )

    +"px";


    line.style.opacity =

    (
        .25
        +
        Math.random()*.55
    );


    line.style.animationDuration =

    (
        4
        +
        Math.random()*6
    )

    +"s";


    line.style.animationDelay =

    (
        -
        Math.random()*10
    )

    +"s";


    scene.appendChild(line);

}


/* =========================
   PARÇACIKLAR
========================= */

for(
    let i=0;
    i<60;
    i++
){

    const p =
    document.createElement("div");


    p.className =

    "particle " +

    (
        i % 2 === 0
        ? "blue"
        : "green"
    );


    const size =

    1
    +
    Math.random()*3;


    p.style.width =
    size+"px";

    p.style.height =
    size+"px";


    p.style.left =

    Math.random()
    *100
    +"%";


    p.style.top =

    Math.random()
    *100
    +"%";


    p.style.animationDuration =

    (
        5
        +
        Math.random()*8
    )

    +"s";


    p.style.animationDelay =

    (
        -
        Math.random()*10
    )

    +"s";


    scene.appendChild(p);

}


/* =========================
   DAKTİLO EFEKTİ
========================= */

const sloganText =
"FROM FEATHER TO FLIGHT";


const slogan =
document.getElementById("slogan");


let letter = 0;


/*
   Harfleri tek tek yaz
*/

function typeWriter(){

    if(
        letter
        <
        sloganText.length
    ){

        slogan.textContent +=
        sloganText.charAt(letter);


        letter++;


        setTimeout(
            typeWriter,
            115
        );

    }

    else{

        /*
           Yazı tamamlanınca
           biraz bekle
        */

        setTimeout(

            eraseText,

            3500

        );

    }

}


/*
   Sonra tekrar başlamak için
   harfleri geriye doğru sil
*/

function eraseText(){

    if(
        slogan.textContent.length
        >
        0
    ){

        slogan.textContent =

        slogan.textContent.slice(
            0,
            -1
        );


        setTimeout(
            eraseText,
            45
        );

    }

    else{

        letter=0;


        setTimeout(
            typeWriter,
            700
        );

    }

}


/*
   Sayfa açıldıktan sonra
   daktilo başlasın
*/

setTimeout(
    typeWriter,
    900
);


</script>


</body>

</html>
