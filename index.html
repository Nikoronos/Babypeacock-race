<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Geceler Nida</title>
    <style>
        /* Zarif el yazısı ve yumuşak, okunaklı alt metin fontları */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            /* Merkeze doğru hafif moraran yumuşak gece mavisi arka plan */
            background: radial-gradient(circle at center, #1b0033 0%, #020111 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 90%;
            max-width: 600px;
        }

        /* Zarif ve Kıvrımlı Neon Başlık */
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            font-weight: 400;
            margin-bottom: 30px;
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff66b2,
                0 0 40px #ff66b2,
                0 0 80px #ff1a8c,
                0 0 90px #ff1a8c;
            animation: soft-pulse 2.5s infinite alternate;
            line-height: 1.1;
        }

        /* İsmi biraz daha büyük ve vurgulu yapıyoruz */
        .name {
            font-size: 5.5rem;
            display: block;
            margin-top: 5px;
        }

        /* Daha sade ve okunaklı, göz yormayan alt metin */
        p {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.8;
            color: #e6e6fa; /* Açık lavanta rengi */
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            margin-top: 20px;
            letter-spacing: 1px;
        }

        /* Daha yumuşak nefes alma efekti */
        @keyframes soft-pulse {
            0% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 4px #fff,
                    0 0 10px #ff66b2,
                    0 0 20px #ff1a8c,
                    0 0 40px #ff1a8c;
            }
            100% {
                text-shadow:
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 25px #ff66b2,
                    0 0 50px #ff1a8c,
                    0 0 90px #ff1a8c;
            }
        }

        /* Arka plan yıldızları */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); box-shadow: 0 0 6px #fff; }
        }

        /* Mobil ekranlar için font boyutlarını küçültme */
        @media (max-width: 768px) {
            h1 { font-size: 3.2rem; margin-bottom: 20px; }
            .name { font-size: 4.5rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>İyi Geceler <span class="name">Nida</span></h1>
        <p>
            Günün tüm yorgunluğu yıldızların ışıltısında kaybolsun.<br><br>
            Yarın sabah güneş, yepyeni umutlarla senin için doğsun.<br>
            Tatlı rüyalar...
        </p>
    </div>

    <script>
        // Sayfa boyutlarına göre taşma yapmayan yıldız algoritması
        const starCount = 100;
        const body = document.querySelector('body');

        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.classList.add('star');
            
            // % (vw/vh) bazlı konumlandırma ile kaydırma çubuğu çıkmasını engelliyoruz
            let x = Math.random() * 100;
            let y = Math.random() * 100;
            
            let size = Math.random() * 2 + 0.5;
            let duration = Math.random() * 3 + 1.5;
            let delay = Math.random() * 2;

            star.style.left = x + 'vw';
            star.style.top = y + 'vh';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDuration = duration + 's';
            star.style.animationDelay = delay + 's'; // Yıldızların hepsi aynı anda yanıp sönmesin diye gecikme

            body.appendChild(star);
        }
    </script>
</body>
</html>
