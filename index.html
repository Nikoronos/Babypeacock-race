<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BABYPEACOCK</title>

<style>

/* =========================
   TEMEL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================
   ARKA PLAN
========================= */

#scene{
    position:absolute;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 46%,
            rgba(0,255,120,.09),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 48%,
            rgba(0,150,255,.06),
            transparent 48%
        ),

        #000;
}


/* =========================
   PARÇACIKLAR
========================= */

.particle{
    position:absolute;
    border-radius:50%;
    animation:particleMove linear infinite;
}

.particle.blue{
    background:#00bfff;
    box-shadow:0 0 6px #00bfff;
}

.particle.green{
    background:#00ff66;
    box-shadow:0 0 6px #00ff66;
}

@keyframes particleMove{

    0%{
        transform:translateY(40px);
        opacity:0;
    }

    25%{
        opacity:.8;
    }

    100%{
        transform:translateY(-150px);
        opacity:0;
    }
}


/* =========================
   NEON HIZ ÇİZGİLERİ
========================= */

.speedLine{
    position:absolute;
    height:2px;
    border-radius:20px;
    animation:speedMove linear infinite;
}

.speedLine.blue{
    background:#008cff;

    box-shadow:
        0 0 5px #008cff,
        0 0 10px rgba(0,140,255,.55);
}

.speedLine.green{
    background:#00d94f;

    box-shadow:
        0 0 5px #00d94f,
        0 0 10px rgba(0,220,80,.55);
}

@keyframes speedMove{

    from{
        transform:translateX(-130vw);
    }

    to{
        transform:translateX(230vw);
    }
}


/* =========================
   ANA ALAN
========================= */

.content{
    position:relative;
    z-index:10;

    width:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:0 12px;
}


/* =========================
   TAVUS KUŞU
========================= */

.peacock{

    width:min(58vw,330px);

    height:auto;

    display:block;

    object-fit:contain;


    /*
       ÖNEMLİ KISIM:

       JPG içindeki siyah renk,
       arka plandan daha koyu olduğu için
       LIGHTEN modu siyahı göstermiyor.

       Renkli kuş görünmeye devam ediyor.
    */

    mix-blend-mode:lighten;


    /*
       Rectangle oluşturan
       drop-shadow YOK.
    */

    filter:
        saturate(1.15)
        contrast(1.08)
        brightness(1.05);


    margin-bottom:22px;


    animation:
        birdFloat
        4s
        ease-in-out
        infinite;
}


@keyframes birdFloat{

    0%,
    100%{
        transform:
            translateY(0)
            scale(1);
    }

    50%{
        transform:
            translateY(-5px)
            scale(1.02);
    }
}


/* =========================
   BABYPEACOCK LOGO
========================= */

.logo{

    position:relative;

    width:100%;

    text-align:center;

    white-space:nowrap;

    font-size:
        clamp(
            25px,
            7.3vw,
            72px
        );

    font-weight:900;

    letter-spacing:.02em;


    background:
        linear-gradient(
            90deg,

            #009cff,

            #00dcff,

            #00ff9d,

            #45ff45
        );


    -webkit-background-clip:text;

    background-clip:text;

    -webkit-text-fill-color:transparent;


    text-shadow:
        0 0 2px rgba(0,200,255,.9),
        0 0 6px rgba(0,255,120,.45);
}


/* =========================
   LOGO ÜZERİNDEN IŞIK
========================= */

.logo::after{

    content:"";

    position:absolute;

    top:-25%;

    left:-35%;

    width:16%;

    height:150%;


    background:

        linear-gradient(
            90deg,

            transparent,

            rgba(255,255,255,.75),

            transparent
        );


    transform:
        skewX(-20deg);


    filter:
        blur(2px);


    animation:
        logoScan
        5s
        ease-in-out
        infinite;
}


@keyframes logoScan{

    0%,
    20%{
        left:-35%;
        opacity:0;
    }

    30%{
        opacity:.8;
    }

    60%{
        left:120%;
        opacity:0;
    }

    100%{
        left:120%;
        opacity:0;
    }
}


/* =========================
   SLOGAN
========================= */

.sloganBox{

    margin-top:18px;

    height:25px;

    display:flex;

    justify-content:center;

    align-items:center;
}


#slogan{

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            10px,
            2.3vw,
            15px
        );

    letter-spacing:.20em;

    color:#88ddff;

    white-space:nowrap;

    text-shadow:
        0 0 5px
        rgba(0,180,255,.55);
}


/* =========================
   DAKTİLO İMLECİ
========================= */

.cursor{

    width:2px;

    height:15px;

    margin-left:4px;

    background:#00ff88;

    box-shadow:
        0 0 5px #00ff88;

    animation:
        blink
        .65s
        infinite;
}


@keyframes blink{

    0%,
    48%{
        opacity:1;
    }

    49%,
    100%{
        opacity:0;
    }
}


/* =========================
   ALT GRID
========================= */

.grid{

    position:absolute;

    left:-30%;

    bottom:-6%;

    width:160%;

    height:25%;


    opacity:.10;


    transform:
        perspective(350px)
        rotateX(65deg);


    transform-origin:
        center bottom;


    background-image:

        linear-gradient(
            rgba(0,255,100,.6)
            1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,150,255,.6)
            1px,
            transparent 1px
        );


    background-size:
        100% 32px,
        48px 100%;


    animation:
        gridMove
        2.5s
        linear
        infinite;
}


@keyframes gridMove{

    from{
        background-position:
            0 0,
            0 0;
    }

    to{
        background-position:
            0 32px,
            0 0;
    }
}


/* =========================
   MOBİL
========================= */

@media(max-width:420px){

    .peacock{
        width:55vw;
        max-width:285px;
    }

    .logo{
        font-size:7.15vw;
    }

    #slogan{
        font-size:2.25vw;
        letter-spacing:.18em;
    }
}

</style>

</head>


<body>


<div id="scene">

    <div class="grid"></div>

</div>


<div class="content">


    <!-- KUŞ -->

    <img
        src="drXH10s8.jpg"
        class="peacock"
        alt="Babypeacock">


    <!-- LOGO -->

    <div class="logo">

        BABYPEACOCK

    </div>


    <!-- SLOGAN -->

    <div class="sloganBox">

        <span id="slogan"></span>

        <span class="cursor"></span>

    </div>


</div>


<script>


/* =========================
   ARKA PLAN
========================= */

const scene =
document.getElementById("scene");


/* HIZ ÇİZGİLERİ */

for(let i=0;i<30;i++){

    const line =
    document.createElement("div");


    line.className =
        "speedLine " +
        (
            i%2===0
            ? "blue"
            : "green"
        );


    line.style.top =
        Math.random()*100+"%";


    line.style.left =
        (-400-Math.random()*500)+"px";


    line.style.width =
        (60+Math.random()*250)+"px";


    line.style.opacity =
        (.20+Math.random()*.55);


    line.style.animationDuration =
        (4+Math.random()*7)+"s";


    line.style.animationDelay =
        (-Math.random()*10)+"s";


    scene.appendChild(line);
}


/* =========================
   PARÇACIK
========================= */

for(let i=0;i<60;i++){

    const particle =
    document.createElement("div");


    particle.className =
        "particle " +
        (
            i%2===0
            ? "blue"
            : "green"
        );


    const size =
        1+Math.random()*3;


    particle.style.width =
        size+"px";

    particle.style.height =
        size+"px";


    particle.style.left =
        Math.random()*100+"%";


    particle.style.top =
        Math.random()*100+"%";


    particle.style.animationDuration =
        (5+Math.random()*8)+"s";


    particle.style.animationDelay =
        (-Math.random()*10)+"s";


    scene.appendChild(particle);
}


/* =========================
   DAKTİLO
========================= */

const text =
"FROM FEATHER TO FLIGHT";


const slogan =
document.getElementById("slogan");


let index=0;


function writeText(){

    if(index < text.length){

        slogan.textContent +=
            text.charAt(index);

        index++;

        setTimeout(
            writeText,
            120
        );

    }

    else{

        /*
           Tam yazıldıktan sonra
           4 saniye bekle
        */

        setTimeout(
            eraseText,
            4000
        );
    }
}


function eraseText(){

    if(slogan.textContent.length > 0){

        slogan.textContent =
            slogan.textContent.slice(
                0,
                -1
            );

        setTimeout(
            eraseText,
            45
        );

    }

    else{

        index=0;

        setTimeout(
            writeText,
            800
        );
    }
}


/* Başlat */

setTimeout(
    writeText,
    900
);


</script>


</body>

</html>
