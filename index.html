<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babypeacock Race - GTA Neon</title>
    <style>
        /* Retro/Neon fontunu Google'dan çekiyoruz */
        @import url('https://fonts.googleapis.com/css2?family=Monoton&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            overflow: hidden;
            touch-action: none; /* Mobilde ekranın kaymasını engeller */
        }

        /* GTA Vice City Tarzı Hareketli 3D Neon Izgara */
        .neon-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            bottom: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.4) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(70deg);
            animation: moveGrid 3s linear infinite;
            z-index: 1;
        }

        @keyframes moveGrid {
            0% { transform: perspective(600px) rotateX(70deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(70deg) translateY(60px); }
        }

        /* Neon Başlık Yazısı */
        .neon-title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            font-family: 'Monoton', cursive;
            font-size: 45px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            z-index: 10;
        }

        /* Kuş Karakteri */
        #player {
            position: absolute;
            width: 120px;
            height: 120px;
            left: 50%;
            top: 70%;
            transform: translate(-50%, -50%);
            /* Senin dosya adın! */
            background-image: url('drXH10s8.jpg'); 
            background-size: cover;
            background-position: center;
            
            /* MUHTEŞEM DETAY: Siyah arkaplanı şeffaf yapar ve kuşu parlatır */
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 20px rgba(0, 255, 0, 0.8));
            
            z-index: 20;
            pointer-events: none;
        }

        /* Etkileşim Alanı */
        #joystick-zone {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- Üstteki Neon Yazı -->
    <div class="neon-title">BABYPEACOCK RACE</div>
    
    <!-- Hareketli Alt Zemin -->
    <div class="neon-grid"></div>
    
    <!-- Senin Kuş Logon -->
    <div id="player"></div>
    
    <!-- Tıklama/Dokunma Algılayıcı -->
    <div id="joystick-zone"></div>

    <script>
        const player = document.getElementById('player');
        const zone = document.getElementById('joystick-zone');
        
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight * 0.7;
        let targetX = posX;
        let targetY = posY;
        let isMoving = false;
        
        const speed = 6; // Kuşun hızı

        function setTarget(e) {
            isMoving = true;
            if(e.touches) {
                targetX = e.touches[0].clientX;
                targetY = e.touches[0].clientY;
            } else {
                targetX = e.clientX;
                targetY = e.clientY;
            }
        }

        // Fare ve Dokunmatik Kontroller
        zone.addEventListener('mousedown', setTarget);
        zone.addEventListener('mousemove', (e) => { if(isMoving) setTarget(e); });
        zone.addEventListener('mouseup', () => isMoving = false);

        zone.addEventListener('touchstart', setTarget);
        zone.addEventListener('touchmove', setTarget);
        zone.addEventListener('touchend', () => isMoving = false);

        // Oyun Döngüsü
        function gameLoop() {
            if (isMoving) {
                const dx = targetX - posX;
                const dy = targetY - posY;
                const dist = Math.hypot(dx, dy);
                
                // Hedefe doğru akıcı hareket
                if (dist > speed) {
                    posX += (dx / dist) * speed;
                    posY += (dy / dist) * speed;
                }
            }
            
            // Kuşun pozisyonunu güncelle
            player.style.left = posX + 'px';
            player.style.top = posY + 'px';

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
