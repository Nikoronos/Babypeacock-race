<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil GTA Test</title>
    <style>
        /* touch-action: none; mobilde ekranın aşağı kaymasını engeller */
        body { margin: 0; overflow: hidden; background: #222; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const playerImg = new Image();
        playerImg.src = 'drXH10s8.jpg'; // Bunu PNG yaparsan siyah kare kaybolur

        const player = { x: canvas.width / 2, y: canvas.height / 2, size: 64, speed: 3, angle: 0 };
        const target = { x: 0, y: 0, active: false };
        const bullets = [];

        // Ekrana Dokunma: Hedefi belirle, yürü ve ateş et
        window.addEventListener('touchstart', e => {
            target.x = e.touches[0].clientX;
            target.y = e.touches[0].clientY;
            target.active = true;
            
            // Dokunulan yöne mermi fırlat
            player.angle = Math.atan2(target.y - player.y, target.x - player.x);
            bullets.push({
                x: player.x, 
                y: player.y,
                vx: Math.cos(player.angle) * 12, // Mermi hızı
                vy: Math.sin(player.angle) * 12
            });
        });

        // Parmağı Sürükleme: Karakter parmağı takip etsin
        window.addEventListener('touchmove', e => {
            target.x = e.touches[0].clientX;
            target.y = e.touches[0].clientY;
            player.angle = Math.atan2(target.y - player.y, target.x - player.x);
        });

        // Parmağı Çekme: Yürümeyi durdur
        window.addEventListener('touchend', () => {
            target.active = false;
        });

        function update() {
            // Yürüme Fiziği
            if (target.active) {
                const dx = target.x - player.x;
                const dy = target.y - player.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist > 10) { // Hedefe çok yakınsa titrememesi için
                    player.x += (dx / dist) * player.speed;
                    player.y += (dy / dist) * player.speed;
                }
            }

            // Mermi Fiziği
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx;
                bullets[i].y += bullets[i].vy;
                
                // Ekrandan çıkan mermileri sil
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
        }

        function draw() {
            // Arka planı temizle
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mermileri çiz
            ctx.fillStyle = '#f1c40f'; // Sarı mermiler
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Oyuncuyu (Kuşu) çiz
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle + Math.PI / 2);
            
            if (playerImg.complete) {
                ctx.drawImage(playerImg, -player.size / 2, -player.size / 2, player.size, player.size);
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
