<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BABYPEACOCK</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,Helvetica,sans-serif;
}

.background{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.line{
position:absolute;
height:3px;
border-radius:5px;
animation:move 5s linear infinite;
}

.line:nth-child(odd){
background:#00ff88;
box-shadow:0 0 20px #00ff88;
}

.line:nth-child(even){
background:#00bfff;
box-shadow:0 0 20px #00bfff;
}

@keyframes move{
0%{
left:-40%;
}
100%{
left:140%;
}
}

.title{
position:relative;
font-size:90px;
font-weight:900;
letter-spacing:8px;
text-transform:uppercase;
background:linear-gradient(90deg,#00bfff,#00ff66);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 10px #00bfff,
0 0 20px #00bfff,
0 0 40px #00ff66,
0 0 80px #00ff66;
}
</style>
</head>

<body>

<div class="background" id="bg"></div>

<div class="title">
BABYPEACOCK
</div>

<script>

const bg=document.getElementById("bg");

for(let i=0;i<60;i++){

let line=document.createElement("div");

line.className="line";

line.style.top=Math.random()*100+"%";

line.style.width=(100+Math.random()*300)+"px";

line.style.animationDuration=(2+Math.random()*5)+"s";

line.style.animationDelay=(-Math.random()*5)+"s";

bg.appendChild(line);

}

</script>

</body>
</html>
