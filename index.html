<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BABYPEACOCK</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* Hareketli arka plan */
#bg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
}

.line{
position:absolute;
height:2px;
border-radius:10px;
animation:move linear infinite;
opacity:.9;
}

.line:nth-child(odd){
background:#00ff66;
box-shadow:0 0 10px #00ff66,
0 0 25px #00ff66;
}

.line:nth-child(even){
background:#00bfff;
box-shadow:0 0 10px #00bfff,
0 0 25px #00bfff;
}

@keyframes move{
0%{
transform:translateX(-150%);
}
100%{
transform:translateX(250%);
}
}

/* Yazı */
.title{
position:relative;
z-index:2;
width:95%;
text-align:center;

font-size:clamp(32px,9vw,80px);
font-weight:900;
letter-spacing:.08em;

background:linear-gradient(90deg,#00bfff,#00ff66);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 8px #00bfff,
0 0 16px #00bfff,
0 0 32px #00ff66,
0 0 60px #00ff66;
}
</style>

</head>

<body>

<div id="bg"></div>

<div class="title">
BABYPEACOCK
</div>

<script>

const bg=document.getElementById("bg");

for(let i=0;i<80;i++){

const line=document.createElement("div");

line.className="line";

line.style.top=Math.random()*100+"%";

line.style.width=(80+Math.random()*260)+"px";

line.style.left=(-300-Math.random()*600)+"px";

line.style.animationDuration=(2+Math.random()*4)+"s";

line.style.animationDelay=(-Math.random()*5)+"s";

bg.appendChild(line);

}

</script>

</body>
</html>
