<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BABYPEACOCK</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   ANA ARKA PLAN
========================= */

.scene{
    position:absolute;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 45%,
            rgba(0,255,130,0.10),
            rgba(0,100,255,0.04) 35%,
            #000 72%);
}


/* =========================
   YILDIZ / PARÇACIK
========================= */

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    opacity:.55;

    animation:particleMove linear infinite;
}

.particle.blue{
    background:#00bfff;
    box-shadow:0 0 6px #00bfff;
}

.particle.green{
    background:#00ff66;
    box-shadow:0 0 6px #00ff66;
}

@keyframes particleMove{

    from{
        transform:translateY(20px);
        opacity:.15;
    }

    50%{
        opacity:.8;
    }

    to{
        transform:translateY(-130px);
        opacity:.05;
    }

}


/* =========================
   NEON HIZ ÇİZGİLERİ
========================= */

.speedline{
    position:absolute;

    height:2px;

    border-radius:30px;

    animation:moveLine linear infinite;
}

.speedline.blue{

    background:#009dff;

    box-shadow:
        0 0 5px #009dff,
        0 0 12px rgba(0,157,255,.55);
}

.speedline.green{

    background:#00d94f;

    box-shadow:
        0 0 5px #00d94f,
        0 0 12px rgba(0,217,79,.55);
}

@keyframes moveLine{

    from{
        transform:translateX(-120vw);
    }

    to{
        transform:translateX(220vw);
    }

}


/* =========================
   TAVUS KUŞU
========================= */

.peacock{

    position:absolute;

    width:min(54vw,330px);

    max-height:45vh;

    object-fit:contain;

    left:50%;
    top:44%;

    transform:translate(-50%,-50%);

    opacity:.14;

    filter:
        drop-shadow(0 0 8px rgba(0,160,255,.7))
        drop-shadow(0 0 16px rgba(0,255,100,.35));

    animation:peacockPulse 5s ease-in-out infinite;
}

@keyframes peacockPulse{

    0%,100%{
        opacity:.10;
        transform:translate(-50%,-50%) scale(.98);
    }

    50%{
        opacity:.24;
        transform:translate(-50%,-50%) scale(1.03);
    }

}


/* =========================
   LOGO BÖLÜMÜ
========================= */

.logo-wrap{

    position:relative;

    z-index:10;

    width:100%;

    padding:0 10px;

    text-align:center;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* Ana logo */

.logo{

    position:relative;

    white-space:nowrap;

    font-size:clamp(25px,7.5vw,74px);

    font-weight:900;

    letter-spacing:.025em;

    line-height:1;

    background:
        linear-gradient(
            90deg,
            #00aaff 0%,
            #00d9ff 35%,
            #00ff88 68%,
            #52ff39 100%
        );

    background-clip:text;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 2px rgba(0,190,255,.85),
        0 0 6px rgba(0,255,130,.55);

    animation:logoBreath 3.5s ease-in-out infinite;
}


@keyframes logoBreath{

    0%,100%{
        filter:brightness(.95);
    }

    50%{
        filter:brightness(1.25);
    }

}


/* =========================
   LOGO ÜZERİNDEN GEÇEN IŞIK
========================= */

.logo::after{

    content:"";

    position:absolute;

    top:-25%;

    left:-35%;

    width:25%;

    height:150%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.85),
            transparent
        );

    transform:skewX(-18deg);

    filter:blur(4px);

    animation:logoScan 4.5s ease-in-out infinite;
}

@keyframes logoScan{

    0%{
        left:-40%;
        opacity:0;
    }

    15%{
        opacity:0;
    }

    35%{
        opacity:.85;
    }

    60%{
        opacity:.25;
    }

    75%{
        left:120%;
        opacity:0;
    }

    100%{
        left:120%;
        opacity:0;
    }

}


/* =========================
   SLOGAN
========================= */

.subtitle{

    margin-top:12px;

    font-size:clamp(9px,2.5vw,15px);

    letter-spacing:.40em;

    color:#9edfff;

    opacity:.75;

    text-shadow:
        0 0 5px rgba(0,180,255,.65);
}


/* =========================
   ALT PERSPEKTİF GRID
========================= */

.grid{

    position:absolute;

    left:-35%;

    bottom:-8%;

    width:170%;

    height:38%;

    opacity:.14;

    transform:
        perspective(320px)
        rotateX(62deg);

    transform-origin:center bottom;

    background-image:

        linear-gradient(
            rgba(0,255,95,.65) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,150,255,.7) 1px,
            transparent 1px
        );

    background-size:
        100% 34px,
        50px 100%;

    animation:gridMove 2.4s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:
            0 0,
            0 0;
    }

    to{
        background-position:
            0 34px,
            0 0;
    }

}


/* =========================
   ALT NEON IŞIK
========================= */

.floorGlow{

    position:absolute;

    left:50%;

    bottom:5%;

    transform:translateX(-50%);

    width:65%;

    height:3px;

    border-radius:50%;

    background:#00cfff;

    box-shadow:
        0 0 12px #00cfff,
        0 0 30px #00ff77;

    opacity:.5;
}


/* =========================
   MOBİL
========================= */

@media(max-width:420px){

    .logo{
        font-size:7.2vw;
    }

    .peacock{
        width:58vw;
    }

    .subtitle{
        letter-spacing:.27em;
    }

}

</style>

</head>

<body>


<div class="scene" id="scene">


    <!-- Tavus kuşu -->

    <img
        src="drXH10s8.jpg"
        class="peacock"
        alt=""
    >


    <!-- Perspektif grid -->

    <div class="grid"></div>


    <!-- Alt ışık -->

    <div class="floorGlow"></div>


</div>


<!-- LOGO -->

<div class="logo-wrap">

    <div class="logo">
        BABYPEACOCK
    </div>

    <div class="subtitle">
        FROM FEATHER TO FLIGHT
    </div>

</div>


<script>

const scene =
    document.getElementById("scene");


/* =========================
   HIZ ÇİZGİLERİ
========================= */

for(let i=0;i<42;i++){

    const line =
        document.createElement("div");

    line.classList.add("speedline");

    line.classList.add(
        i % 2 === 0 ? "blue" : "green"
    );

    line.style.top =
        (Math.random()*100)+"%";

    line.style.left =
        (-500-Math.random()*500)+"px";

    line.style.width =
        (70+Math.random()*260)+"px";

    line.style.height =
        (1+Math.random()*2.5)+"px";

    line.style.opacity =
        (.30+Math.random()*.65);

    line.style.animationDuration =
        (3+Math.random()*6)+"s";

    line.style.animationDelay =
        (-Math.random()*8)+"s";

    scene.appendChild(line);

}


/* =========================
   PARÇACIKLAR
========================= */

for(let i=0;i<70;i++){

    const particle =
        document.createElement("div");

    particle.classList.add("particle");

    particle.classList.add(
        i % 2 === 0 ? "blue" : "green"
    );

    particle.style.left =
        Math.random()*100+"%";

    particle.style.top =
        Math.random()*100+"%";

    const size =
        1+Math.random()*2;

    particle.style.width =
        size+"px";

    particle.style.height =
        size+"px";

    particle.style.animationDuration =
        (4+Math.random()*8)+"s";

    particle.style.animationDelay =
        (-Math.random()*10)+"s";

    scene.appendChild(particle);

}

</script>

</body>
</html>
