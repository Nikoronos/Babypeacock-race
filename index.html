<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Geceler Nida Baş</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Monoton&family=Poppins:wght@300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020111; /* Derin gece mavisi */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            position: relative;
        }

        /* İçerik kutusu */
        .container {
            z-index: 10;
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.2);
            backdrop-filter: blur(5px);
        }

        /* Neon Tabela Efekti */
        h1 {
            font-family: 'Monoton', cursive, sans-serif;
            font-size: 4rem;
            font-weight: normal;
            color: #fff;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de,
                0 0 90px #ff00de,
                0 0 100px #ff00de,
                0 0 150px #ff00de;
            animation: pulsate 1.5s infinite alternate;
        }

        /* Alt Yazı Efekti */
        p.message {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        /* Neon Nefes Alma Animasyonu */
        @keyframes pulsate {
            100% {
                text-shadow:
                    0 0 4px #fff,
                    0 0 11px #fff,
                    0 0 19px #fff,
                    0 0 40px #bc13fe,
                    0 0 80px #bc13fe,
                    0 0 90px #bc13fe,
                    0 0 100px #bc13fe,
                    0 0 150px #bc13fe;
            }
            0% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 4px #fff,
                    0 0 6px #fff,
                    0 0 10px #bc13fe,
                    0 0 45px #bc13fe,
                    0 0 55px #bc13fe,
                    0 0 70px #bc13fe,
                    0 0 80px #bc13fe;
            }
        }

        /* Yıldızlar için CSS */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        /* Yıldız Parlama Animasyonu */
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px white; }
        }
        
        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p.message { font-size: 1.5rem; }
            .container { padding: 20px; width: 90%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İYİ GECELER<br>NİDA BAŞ</h1>
        <p class="message">
            Günün tüm yorgunluğu yıldızların ışıltısında kaybolsun.<br>
            Yarın sabah güneş, yepyeni umutlarla senin için doğsun.<br>
            Tatlı rüyalar...
        </p>
    </div>

    <script>
        // Arka plana rastgele yanıp sönen yıldızlar ekleyen JavaScript kodu
        const starCount = 150; // Gökyüzündeki yıldız sayısı
        const body = document.querySelector('body');

        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.classList.add('star');
            
            // Rastgele konum (X ve Y ekseni)
            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;
            
            // Rastgele boyut ve animasyon süresi
            let size = Math.random() * 3;
            let duration = Math.random() * 3 + 1; // 1 ile 4 saniye arası

            star.style.left = x + 'px';
            star.style.top = y + 'px';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDuration = duration + 's';

            body.appendChild(star);
        }

        // Pencere boyutu değiştiğinde yıldızların taşmasını engellemek için basit bir kontrol
        window.addEventListener('resize', () => {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                if (parseFloat(star.style.left) > window.innerWidth || parseFloat(star.style.top) > window.innerHeight) {
                    star.style.left = Math.random() * window.innerWidth + 'px';
                    star.style.top = Math.random() * window.innerHeight + 'px';
                }
            });
        });
    </script>
</body>
</html>
